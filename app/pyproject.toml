[project]
name = "global-context-bot"
version = "0.2.0"
description = "PS02 Global Context: GLID context files + Sarvam voice/chat agent that learns from each conversation"
requires-python = ">=3.11"
# Same list as requirements.txt (setup.sh installs from requirements.txt).
dependencies = [
    "pipecat-ai[webrtc,sarvam,silero,runner]==1.12.0",
    "sarvamai==0.1.28",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
]
