services:
  - type: web
    name: indiamart-global-context-demo
    runtime: python
    plan: free
    buildCommand: pip install -r app/requirements-render.txt
    startCommand: cd app && uvicorn console:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: GC_MODE
        value: demo
      - key: GC_DEMO_DIR
        value: demo_data
      - key: ENABLE_VOICE
        value: "true"
      - key: VOICE_TRANSPORT
        value: websocket
      - key: SARVAM_API_KEY
        sync: false
